[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "childrens-publishing-crew"
version = "0.1.0"
description = "Children's publishing research and executive planning starter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["crewai>=1.0,<2", "pydantic>=2.10,<3", "python-dotenv>=1.0,<2", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
web = ["crewai-tools>=1.0,<2"]

[project.scripts]
publishing-crew = "publishing_crew.main:run"
run_crew = "publishing_crew.main:run"

[tool.crewai]
type = "crew"

[tool.hatch.build.targets.wheel]
packages = ["src/publishing_crew"]
